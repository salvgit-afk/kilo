[pytest]
# Un test parametrico senza casi deve fallire, non essere saltato: è così che
# il controllo "ogni rotta richiede l'accesso" era sparito in silenzio con
# l'aggiornamento di FastAPI.
empty_parameter_set_mark = fail_at_collect
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
