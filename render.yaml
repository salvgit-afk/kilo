# Blueprint Render per il backend di Kilo.
# Guida completa: DEPLOY.md
#
# Il frontend NON è qui: va su Vercel (vedi DEPLOY.md).

services:
  - name: kilo-backend
    type: web
    runtime: python
    plan: free
    # Stessa regione del database Neon (eu-central-1 = Frankfurt): ogni query
    # attraversa l'oceano se backend e database stanno in continenti diversi.
    region: frankfurt
    rootDir: backend
    # Il pre-deploy command non è disponibile sul piano free: le migrazioni
    # partono nella build (le variabili d'ambiente ci sono anche lì), una
    # volta per deploy. Prima giravano a ogni avvio, cioè a ogni risveglio di
    # Render, allungando l'attesa e facendo dipendere la partenza da Neon.
    # Se una migrazione fallisce la build fallisce e resta online la versione
    # precedente. `upgrade head` è idempotente.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Chiave di firma delle sessioni: generata da Render (256 bit casuali).
      # Attenzione: cambiarla disconnette tutti gli utenti.
      - key: SECRET_KEY
        generateValue: true
      # Segreti: Render li chiede alla creazione del Blueprint, non stanno nel repo.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Email degli account amministratori (separate da virgola): solo loro
      # possono lanciare «Aggiorna catalogo».
      - key: ADMIN_EMAILS
        sync: false
      - key: USDA_API_KEY
        sync: false
      # Notifiche push: chiavi da `python scripts/generate_vapid_keys.py`,
      # segreto a scelta (lo stesso nei secrets di GitHub). Vedi DEPLOY.md.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_CRON_SECRET
        sync: false
      # Stesso valore su Vercel: il proxy di Next dice al backend l'indirizzo
      # vero di chi si collega (limiti contro i tentativi di accesso). Vedi DEPLOY.md.
      - key: PROXY_SECRET
        sync: false
      # Facoltativo: registrazione solo per queste email (separate da virgola).
      - key: ALLOWED_EMAILS
        sync: false
      # Email di verifica e password dimenticata (Brevo, gratuito). Senza,
      # la registrazione non chiede il codice. Vedi DEPLOY.md.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
