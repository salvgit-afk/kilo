<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kilo · offline</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #07080d; color: rgba(255,255,255,.85);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center;
    }
    img { width: 84px; height: 84px; }
    h1 { font-size: 22px; margin: 18px 0 6px; color: #fff; }
    p { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.5); max-width: 300px; margin: 0 auto; }
    button {
      margin-top: 22px; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 14px; font-weight: 600;
      background: linear-gradient(#b6e35a, #8fc22c); color: #07080d;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sei offline</h1>
    <p>Kilo ha bisogno della connessione per leggere e salvare i tuoi dati. Riprova appena torna la rete.</p>
    <button onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
